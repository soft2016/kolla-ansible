---
- name: Test for leaked passwords in journal and kolla-ansible logs
  become: true
  kolla_ansible_password_check:
    passwords_file: "{{ kolla_ansible_check_passwords_file }}"
    ignore_keys: "{{ kolla_ansible_check_ignore_keys }}"
    log_files: "{{ kolla_ansible_check_log_files }}"
    exclude_log_files: "{{ kolla_ansible_check_exclude_log_files }}"
  when: inventory_hostname == 'primary'
