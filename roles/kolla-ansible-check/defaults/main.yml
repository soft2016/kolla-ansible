---
kolla_ansible_check_passwords_file: /etc/kolla/passwords.yml
# Saved kolla-ansible command output. Test script output is excluded, as
# those scripts use passwords on purpose.
kolla_ansible_check_log_files:
  - /tmp/logs/ansible/*
kolla_ansible_check_exclude_log_files:
  - /tmp/logs/ansible/test-*
